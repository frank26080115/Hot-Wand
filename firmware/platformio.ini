[platformio]
default_envs = stm32f042
include_dir = inc

; It is NOT critical for the code to fit within the flash size of the STM32F030, but it is critical that it fit within the flash size of the STM32F042.  The STM32F042 has a larger flash size, so we can use that as a limit for both targets.
; [env:stm32f030]
; platform = ststm32@19.7.1
; board = demo_f030f4
; framework = stm32cube
; board_build.ldscript = stm32f030f4_nvm.ld
; board_upload.maximum_size = 15360
; upload_protocol = stlink
; debug_tool = stlink
; monitor_speed = 115200
; build_flags =
;     -D HOT_WAND_TARGET_STM32F030=1
;     -D U8X8_WITH_USER_PTR=1
;     -D HSE_VALUE=27120000
;     -flto

[env:stm32f042]
platform = ststm32@19.7.1
extra_scripts = post:tools/export_hex.py
board = hotwand_f042f6
framework = stm32cube
board_build.ldscript = stm32f042f6_nvm.ld
board_upload.maximum_size = 31744
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags =
    -D HOT_WAND_TARGET_STM32F042=1
    -D U8X8_WITH_USER_PTR=1
    -D HSE_VALUE=27120000
    -flto
; Add `-D FAN_STARTUP_OFF_TIME_MS=0` to build_flags when no debugger window is desired.

; One full-application image for every automated SWD test: ADC FIFO,
; synthetic button and tip detection, and the sent-framebuffer mirror.
; RF is unconditionally off; buck attenuation stays GPIO-high/minimum.
; Logical limiter/PWM calculations remain available for assertions.
; Camera calibration is a runtime opt-in, using this same ELF. Ordinary splash
; assets are excluded to leave room for the harnesses. Keep both SWD pins free.
[env:stm32f042_test]
extends = env:stm32f042
build_type = debug
debug_build_flags =
    -Os
    -g3
    -ggdb3
build_flags =
    ${env:stm32f042.build_flags}
    -D HOT_WAND_TEST_HARNESS=1
    ; Exercise optional-feature positive cases in the physically inhibited harness.
    ; Regular firmware retains the disabled defaults from conf.h.
    -D LEAKY_BUCKET_ENABLED=1
    -D PWRMGT_POWER_LOSS_SUSTAINED_ENABLED=1
    -Wl,--undefined=adc_sim_enqueue
    -Wl,--undefined=setup_menu_item_count
    -D HOT_WAND_SWD_DEBUG=1
    -D FAN_STARTUP_OFF_TIME_MS=4294967295

; Clone ST-Link V2 fallback: ST's driver connects reliably under hardware reset.
; Tested with V2J37S7. OpenOCD's additional reset-halt sequence can time out.
; Select this environment explicitly; the ordinary ST-Link profile stays default.
; CubeProgrammer receives the application BIN only, leaving the reserved NVM page intact.
[env:stm32f042_stlink_v2_clone]
extends = env:stm32f042
upload_protocol = custom
upload_command = "C:/Program Files (x86)/STMicroelectronics/STM32Cube/STM32CubeProgrammer/bin/STM32_Programmer_CLI.exe" -c port=SWD freq=100 mode=UR reset=HWrst -d "$SOURCE" 0x08000000 -v -rst

[env:stm32f042_no_fan_pwm]
extends = env:stm32f042
build_flags =
    ${env:stm32f042.build_flags}
    -D FAN_PWM_ENABLED=0


; Debug-symbol build consumed by the STM32CubeIDE Makefile project.
; Bring-up-only image: production main and setup menu are not compiled.
; Splash assets remain available for the OLED splash bring-up test and are
; discarded by the linker when that test is not selected.
; PA13/PA14 are reserved for SWD so a missed breakpoint cannot disconnect GDB.
[env:stm32f042_cubeide]
extends = env:stm32f042
build_type = debug
build_unflags =
    -flto
debug_build_flags =
    -Og
    -g3
    -ggdb3
build_src_filter =
    +<*>
    -<main.c>
    -<setup_menu.c>
build_flags =
    ${env:stm32f042.build_flags}
    -fno-omit-frame-pointer
    -D HOT_WAND_BRINGUP_BUILD=1
    -D HOT_WAND_SWD_DEBUG=1
    -D FAN_STARTUP_OFF_TIME_MS=4294967295UL

; Standalone sweep image. UART TX takes PA14, so SWD/GDB is unavailable after
; the first CSV line. The CubeIDE environment above keeps UART disabled and
; exposes the result table through GDB instead.
[env:stm32f042_sweep_uart]
extends = env:stm32f042
build_type = debug
build_src_filter =
    +<*>
    -<main.c>
    -<setup_menu.c>
build_flags =
    ${env:stm32f042.build_flags}
    -D HOT_WAND_BRINGUP_BUILD=1
    -D TEST_PWRLVL_SWEEP_UART=1
