[platformio]
default_envs = seeed_xiao_samd21
include_dir = inc

[env:seeed_xiao_samd21]
platform = atmelsam@8.3.0
board = seeed_xiao
framework = arduino
monitor_speed = 115200
build_flags =
    -D HOT_WAND_TARGET_XIAO_SAMD21=1
build_src_filter =
    +<*>
    -<rfgen_rp2040.cpp>

[env:seeed_xiao_rp2040]
platform = raspberrypi@1.20.0
board = seeed_xiao_rp2040
framework = arduino
monitor_speed = 115200
build_flags =
    -D HOT_WAND_TARGET_XIAO_RP2040=1
build_src_filter =
    +<*>
    -<rfgen_samd21.cpp>
