[platformio]
default_envs = seeed_xiao_samd21
include_dir = inc

[common]
lib_deps =
    ppedro74/SerialCommands@^2.2.0

[env:seeed_xiao_samd21]
extra_scripts = post:tools/export_uf2.py
platform = atmelsam@8.3.0
board = seeed_xiao
framework = arduino
lib_deps = ${common.lib_deps}
monitor_speed = 115200
build_flags =
    -D HOTWANDLITE_MCU_SAMD21=1
    -D HOTWANDLITE_TARGET_XIAO_SAMD21=1
    ; Uncomment to generate and print RF tables without touching PWM or DMA.
    ; -D RFGEN_MUTED_DEBUG=1
build_src_filter =
    +<*>
    -<rfgen_rp2040.cpp>
    -<rfgen_esp32_rmt.cpp>
    -<rfgen_esp32c3.cpp>
    -<rfgen_esp32s3.cpp>

[common_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#9c167c6b8aac4f4cfa6d55a0c4e5b848795150c0
framework = arduino
lib_deps = ${common.lib_deps}
monitor_speed = 115200
upload_protocol = picotool
build_flags =
    -D HOTWANDLITE_MCU_RP2040=1
build_src_filter =
    +<*>
    -<rfgen_samd21.cpp>
    -<rfgen_esp32_rmt.cpp>
    -<rfgen_esp32c3.cpp>
    -<rfgen_esp32s3.cpp>

[common_esp32c3]
extra_scripts = post:tools/package_esp32c3.py
platform = espressif32@7.0.1
board = seeed_xiao_esp32c3
framework = arduino
lib_deps = ${common.lib_deps}
monitor_speed = 115200
build_flags =
    -D HOTWANDLITE_MCU_ESP32C3=1
build_src_filter =
    +<*>
    -<rfgen_samd21.cpp>
    -<rfgen_rp2040.cpp>
    -<rfgen_esp32s3.cpp>

[env:seeed_xiao_rp2040]
extends = common_rp2040
board = seeed_xiao_rp2040
build_flags =
    ${common_rp2040.build_flags}
    -D HOTWANDLITE_TARGET_XIAO_RP2040=1
    ; Uncomment to generate and print RF tables without touching PWM or DMA.
    ; -D RFGEN_MUTED_DEBUG=1

[env:waveshare_rp2040_zero]
extends = common_rp2040
board = waveshare_rp2040_zero
build_flags =
    ${common_rp2040.build_flags}
    -D HOTWANDLITE_TARGET_WAVESHARE_RP2040_ZERO=1
    ; Uncomment to generate and print RF tables without touching PWM or DMA.
    ; -D RFGEN_MUTED_DEBUG=1

[env:seeed_xiao_esp32c3]
extends = common_esp32c3
build_flags =
    ${common_esp32c3.build_flags}
    -D HOTWANDLITE_TARGET_XIAO_ESP32C3=1
    ; Uncomment to generate and print RF tables without touching RMT.
    ; -D RFGEN_MUTED_DEBUG=1

; PCB -1: isolate module D9 and jumper PCB D9/PWR-DIS to module D3.
; Remove the module from the PCB for flashing; see doc/xiao-esp32c3-v1-rework.md.
[env:seeed_xiao_esp32c3_v1_reworked]
extends = env:seeed_xiao_esp32c3
build_flags =
    ${env:seeed_xiao_esp32c3.build_flags}
    -D HOTWANDLITE_PCB_VERSION=-1

[env:esp32c3_supermini]
extends = common_esp32c3
build_flags =
    ${common_esp32c3.build_flags}
    -D HOTWANDLITE_TARGET_ESP32C3_SUPERMINI=1
    ; Uncomment to generate and print RF tables without touching RMT.
    ; -D RFGEN_MUTED_DEBUG=1

[env:native_rfgen_tests]
platform = native
extra_scripts = pre:tools/platformio_use_llvm.py
test_framework = unity
test_build_src = true
test_filter = test_rfgen_common
build_flags =
    -D RFGEN_UNIT_TEST=1
build_src_filter =
    -<*>
    +<rfgen_common.cpp>

[env:native_power_tests]
platform = native
extra_scripts = pre:tools/platformio_use_llvm.py
test_framework = unity
test_build_src = true
test_filter = test_power
build_flags =
    -D POWER_UNIT_TEST=1
    -D HOTWANDLITE_MCU_SAMD21=1
    -D HOTWANDLITE_TARGET_XIAO_SAMD21=1
    -I test/support
build_src_filter =
    -<*>
    +<power.cpp>

[env:native_rfgen_macro_tests]
extends = env:native_rfgen_tests
test_filter = test_rfgen_macro
build_flags =
    -D RFGEN_UNIT_TEST=1
    -D RFGEN_MACRO_UNIT_TEST=1
    -D HOTWANDLITE_MCU_ESP32C3=1
    -I test/support

