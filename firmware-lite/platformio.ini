[platformio]
default_envs = seeed_xiao_samd21
include_dir = inc

[env:seeed_xiao_samd21]
platform = atmelsam@8.3.0
board = seeed_xiao
framework = arduino
monitor_speed = 115200
build_flags =
    -D HOT_WAND_TARGET_XIAO_SAMD21=1
    ; Uncomment to generate and print RF tables without touching PWM or DMA.
    ; -D RFGEN_MUTED_DEBUG=1
build_src_filter =
    +<*>
    -<rfgen_rp2040.cpp>

[env:seeed_xiao_rp2040]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-rp2040
framework = arduino
monitor_speed = 115200
build_flags =
    -D HOT_WAND_TARGET_XIAO_RP2040=1
    ; Uncomment to generate and print RF tables without touching PWM or DMA.
    ; -D RFGEN_MUTED_DEBUG=1
build_src_filter =
    +<*>
    -<rfgen_samd21.cpp>

[env:native_rfgen_tests]
platform = native
test_framework = unity
test_build_src = true
build_flags =
    -D RFGEN_UNIT_TEST=1
build_src_filter =
    -<*>
    +<rfgen_common.cpp>

[env:native_rfgen_muted_tests]
platform = native
test_framework = unity
test_build_src = true
build_flags =
    -D RFGEN_UNIT_TEST=1
    -D RFGEN_MUTED_DEBUG=1
build_src_filter =
    -<*>
    +<rfgen_common.cpp>
